<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Icon Navigation</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-shell">
    <header aria-hidden="true">
        <span class="icon-button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7"></path><path d="M5 9v12h14V9M9 21v-7h6v7"></path></svg>
        </span>
        <span class="icon-button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"></circle><path d="m16 16 5 5"></path></svg>
        </span>
        <span class="icon-button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"></path><path d="M10 21h4"></path></svg>
        </span>
        <span class="icon-button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>
        </span>
    </header>
    <main aria-label="Main content">
        <div class="arrow" data-direction="left" aria-hidden="true">
            <span class="arrow-label">Decline</span>
            <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"></path></svg>
        </div>
        <section class="panel" aria-label="Swipeable content card" tabindex="0"></section>
        <div class="arrow" data-direction="right" aria-hidden="true">
            <span class="arrow-label">Approve</span>
            <svg viewBox="0 0 24 24"><path d="M5 12h14m-7-7 7 7-7 7"></path></svg>
        </div>
    </main>
    <div class="swipe-toast" role="status" aria-live="polite"></div>
    </div>
    <script src="script.js" defer></script>
</body>
</html>
